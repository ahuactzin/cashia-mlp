[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlp"
version = "0.1.0"
description = "Machine Learning Pipeline (MLP): training and experimentation for Cashia"
readme = "README.md"
# requires-python = ">=3.13,<3.14"

authors = [
  { name = "Juan Manuel Ahuactzin" }
]

dependencies = [
    "cashia-core==1.1.0",
    "pandas==2.2.3",
    "numpy==2.2.6",
    "scikit-learn==1.7.2",
    "scipy==1.16.3",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "imbalanced-learn==0.14.2",
    "joblib==1.5.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
